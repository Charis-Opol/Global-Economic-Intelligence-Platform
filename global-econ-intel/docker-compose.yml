# The full stack: nine services, real Airflow/Spark/MLflow/Superset. Needs
# Docker Desktop (or another Compose-compatible engine) actually running.
#
# `docker compose up -d --build` after `cp .env.example .env` and filling
# in real secrets - see the root README's "Getting started" section.
#
# For just the backend + frontend without Docker at all (faster iteration,
# or Docker isn't available), see that same README's "Running locally
# without Docker" section instead - this file isn't involved in that path.
version: "3.9"

x-airflow-common: &airflow-common
  build:
    context: ./airflow
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # Airflow's default safe-mode DAG prefilter skips any .py file whose raw
    # bytes don't contain BOTH the literal substrings "DAG" and "airflow"
    # before even attempting a full parse. The thin per-connector files here
    # (ingest_world_bank.py etc.) just do `from _ingestion_dag_factory import
    # build_ingestion_dag` - neither literal substring appears, so they were
    # being silently skipped entirely (no error, just never parsed) while
    # only the factory modules themselves showed up to the scheduler.
    AIRFLOW__CORE__DAG_DISCOVERY_SAFE_MODE: "false"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    # DAG factories do `from pipelines.tasks.ingestion import ...` - without
    # pipelines/'s parent on PYTHONPATH, every DAG using pipelines.* fails to
    # even parse (ModuleNotFoundError: no module named 'pipelines'). Set to
    # /opt (not /opt/airflow) to match where pipelines/config are mounted
    # below - as *siblings* of warehouse/, exactly like the host repo layout,
    # since pipelines/warehouse/schema.py locates its SQL schema file via
    # `Path(__file__).parents[2] / "warehouse" / "schema"`, which only
    # resolves correctly if pipelines/ and warehouse/ really are siblings.
    PYTHONPATH: /opt
    MINIO_ENDPOINT: ${MINIO_ENDPOINT}
    MINIO_ROOT_USER: ${MINIO_ROOT_USER}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    MLFLOW_TRACKING_URI: http://mlflow:5000
    NEWSAPI_KEY: ${NEWSAPI_KEY}
    # Training DAGs log MLflow artifacts directly (mlflow.log_model etc.),
    # which uploads to s3://gold via boto3 running in *this* container, not
    # through the mlflow server - boto3 needs these standard env var names
    # (not the custom MINIO_* ones above) to find MinIO credentials, or every
    # artifact upload fails with "Unable to locate credentials".
    MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/logs:/opt/airflow/logs
    - ./pipelines:/opt/pipelines
    - ./config:/opt/config
    - ./warehouse:/opt/warehouse
    # Same path spark-master/spark-worker mount this at - the ingestion DAGs'
    # own run_spark_etl task imports common.py/transforms/*.py from here
    # directly (in-process SparkSession, not a spark-submit subprocess) to
    # drive the same Bronze->Silver step previously run by hand.
    - ./spark/jobs:/opt/spark-jobs:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    mlflow:
      condition: service_started

x-superset-common: &superset-common
  build:
    context: ./superset
  environment:
    SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
    DATABASE_DIALECT: postgresql
    DATABASE_HOST: postgres
    DATABASE_DB: superset
    DATABASE_USER: ${POSTGRES_USER}
    DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
    SUPERSET_GUEST_TOKEN_JWT_SECRET: ${SUPERSET_GUEST_TOKEN_JWT_SECRET}
    SUPERSET_ALLOWED_ORIGIN: ${FRONTEND_ORIGIN}
  volumes:
    # Read-only: Superset only ever queries the warehouse, never writes it.
    - ./warehouse:/opt/warehouse:ro
    # For `superset import-assets --path /app/dashboards` - see superset/dashboards/README.md.
    - ./superset/dashboards:/app/dashboards:ro

services:

  # ---------- Metadata store (shared: airflow, mlflow, superset) ----------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      POSTGRES_MULTIPLE_DATABASES: airflow,mlflow,superset
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-multiple-postgres-databases.sh:/docker-entrypoint-initdb.d/init-multiple-postgres-databases.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # ---------- Object storage (Bronze / Silver / Gold) ----------
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb -p local/bronze local/silver local/gold;
      exit 0;
      "

  # ---------- Orchestration ----------
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - "airflow db migrate && airflow users create --username ${AIRFLOW_ADMIN_USER} --password ${AIRFLOW_ADMIN_PASSWORD} --firstname Admin --lastname User --role Admin --email admin@example.com"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ---------- Distributed compute ----------
  # `command:` runs the standalone master/worker directly via spark-class,
  # in the foreground - SPARK_MODE (bitnami/spark's old master/worker
  # switch) does nothing on this image: `bitnami/spark:3.5` no longer
  # resolves to a real pullable tag (Bitnami discontinued the free
  # standalone-cluster image), and what's cached locally under that name is
  # actually the official Apache Spark image, built for Spark-on-Kubernetes
  # (`driver`/`executor` sub-commands) rather than standalone mode.
  spark-master:
    build:
      context: ./spark
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "0.0.0.0", "--port", "7077", "--webui-port", "8080"]
    environment:
      # Read by common.py's build_spark_session() (S3A config) when
      # spark-submit is run client-mode from this container - the driver
      # process picks these up directly from its own container env.
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "7077:7077"
      - "8081:8080"
    volumes:
      - ./spark/jobs:/opt/spark-jobs
      - ./warehouse:/opt/warehouse

  spark-worker:
    build:
      context: ./spark
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    depends_on:
      - spark-master
    volumes:
      - ./spark/jobs:/opt/spark-jobs
      - ./warehouse:/opt/warehouse

  # ---------- Experiment tracking ----------
  mlflow:
    build:
      context: ./mlflow
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/mlflow
      MLFLOW_ARTIFACT_ROOT: s3://gold
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      # MLflow 3.x's built-in DNS-rebinding protection rejects any request
      # whose Host header isn't on this allowlist - training DAGs connect via
      # the Docker service name (http://mlflow:5000), which isn't localhost,
      # so without this every MLflow API call 403s with "Invalid Host header".
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow:5000,localhost:5000,127.0.0.1:5000"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ---------- BI dashboards ----------
  superset-init:
    <<: *superset-common
    entrypoint: /bin/sh
    command:
      - -c
      - "superset db upgrade && superset fab create-admin --username ${SUPERSET_ADMIN_USER} --password ${SUPERSET_ADMIN_PASSWORD} --firstname Admin --lastname User --email admin@example.com || true; superset init && python /app/grant_public_role.py"

  superset:
    <<: *superset-common
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
      superset-init:
        condition: service_completed_successfully

  # ---------- Application layer (backend built out Day 2; frontend UI is Day 3) ----------
  backend:
    build:
      context: ./backend
    environment:
      DUCKDB_PATH: /opt/warehouse/warehouse.duckdb
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # Loading the champion model downloads its artifacts from s3://gold via
      # boto3 directly in this container (mlflow's S3ArtifactRepository) -
      # same requirement as the airflow-common env block above.
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AIRFLOW_BASE_URL: http://airflow-webserver:8080
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      AUTH_ADMIN_USERNAME: ${AUTH_ADMIN_USERNAME}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD}
      SUPERSET_BASE_URL: http://superset:8088
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${FRONTEND_ORIGIN}
    ports:
      - "8000:8000"
    volumes:
      - ./warehouse:/opt/warehouse
    depends_on:
      mlflow:
        condition: service_started
      superset:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_SUPERSET_DOMAIN: http://localhost:8088
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
