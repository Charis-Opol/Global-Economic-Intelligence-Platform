version: "3.9"

x-airflow-common: &airflow-common
  build:
    context: ./airflow
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    MINIO_ENDPOINT: ${MINIO_ENDPOINT}
    MINIO_ROOT_USER: ${MINIO_ROOT_USER}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    MLFLOW_TRACKING_URI: http://mlflow:5000
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/logs:/opt/airflow/logs
    - ./pipelines:/opt/airflow/pipelines
    - ./config:/opt/airflow/config
    - ./warehouse:/opt/warehouse
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    mlflow:
      condition: service_started

x-superset-common: &superset-common
  build:
    context: ./superset
  environment:
    SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
    DATABASE_DIALECT: postgresql
    DATABASE_HOST: postgres
    DATABASE_DB: superset
    DATABASE_USER: ${POSTGRES_USER}
    DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
    SUPERSET_GUEST_TOKEN_JWT_SECRET: ${SUPERSET_GUEST_TOKEN_JWT_SECRET}
    SUPERSET_ALLOWED_ORIGIN: ${FRONTEND_ORIGIN}
  volumes:
    # Read-only: Superset only ever queries the warehouse, never writes it.
    - ./warehouse:/opt/warehouse:ro
    # For `superset import-assets --path /app/dashboards` - see superset/dashboards/README.md.
    - ./superset/dashboards:/app/dashboards:ro

services:

  # ---------- Metadata store (shared: airflow, mlflow, superset) ----------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      POSTGRES_MULTIPLE_DATABASES: airflow,mlflow,superset
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-multiple-postgres-databases.sh:/docker-entrypoint-initdb.d/init-multiple-postgres-databases.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # ---------- Object storage (Bronze / Silver / Gold) ----------
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb -p local/bronze local/silver local/gold;
      exit 0;
      "

  # ---------- Orchestration ----------
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - "airflow db migrate && airflow users create --username ${AIRFLOW_ADMIN_USER} --password ${AIRFLOW_ADMIN_PASSWORD} --firstname Admin --lastname User --role Admin --email admin@example.com"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ---------- Distributed compute ----------
  spark-master:
    build:
      context: ./spark
    environment:
      SPARK_MODE: master
    ports:
      - "7077:7077"
      - "8081:8080"
    volumes:
      - ./spark/jobs:/opt/spark-jobs
      - ./warehouse:/opt/warehouse

  spark-worker:
    build:
      context: ./spark
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
    depends_on:
      - spark-master
    volumes:
      - ./spark/jobs:/opt/spark-jobs
      - ./warehouse:/opt/warehouse

  # ---------- Experiment tracking ----------
  mlflow:
    build:
      context: ./mlflow
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/mlflow
      MLFLOW_ARTIFACT_ROOT: s3://gold
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ---------- BI dashboards ----------
  superset-init:
    <<: *superset-common
    entrypoint: /bin/sh
    command:
      - -c
      - "superset db upgrade && superset fab create-admin --username ${SUPERSET_ADMIN_USER} --password ${SUPERSET_ADMIN_PASSWORD} --firstname Admin --lastname User --email admin@example.com || true; superset init"

  superset:
    <<: *superset-common
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
      superset-init:
        condition: service_completed_successfully

  # ---------- Application layer (backend built out Day 2; frontend UI is Day 3) ----------
  backend:
    build:
      context: ./backend
    environment:
      DUCKDB_PATH: /opt/warehouse/warehouse.duckdb
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      AIRFLOW_BASE_URL: http://airflow-webserver:8080
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      AUTH_ADMIN_USERNAME: ${AUTH_ADMIN_USERNAME}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD}
      SUPERSET_BASE_URL: http://superset:8088
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${FRONTEND_ORIGIN}
    ports:
      - "8000:8000"
    volumes:
      - ./warehouse:/opt/warehouse
    depends_on:
      mlflow:
        condition: service_started
      superset:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_SUPERSET_DOMAIN: http://localhost:8088
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
