#
# Deliberately chart-less: forecasts are computed live from the MLflow
# champion model against the latest warehouse feature row (see the app's own
# /predictions page) - there's no warehouse table of historical prediction
# outputs for Superset to chart without adding a prediction-logging table
# that was never asked for. This is a markdown panel pointing at the real
# feature instead of a fabricated chart.
